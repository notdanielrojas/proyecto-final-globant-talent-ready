name: Playwright E2E Tests (API & Web)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Pruebas de API
  test-api:
    name: Run API E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run API Tests
        env:
          BASE_URL: ${{ secrets.BASE_URL || vars.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL || vars.API_BASE_URL }}
          USER_ADMIN: ${{ secrets.USER_ADMIN }}
          PASSWORD_ADMIN: ${{ secrets.PASSWORD_ADMIN }}
        run: npx playwright test tests/e2e/e2e.api.spec.ts

      - name: Upload API Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: playwright-report/
          retention-days: 30

  # Pruebas Web UI
  test-web:
    name: Run Web E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers and Dependencies
        run: npx playwright install --with-deps

      - name: Run Web Tests
        env:
          BASE_URL: ${{ secrets.BASE_URL || vars.BASE_URL }}
          USER_ADMIN: ${{ secrets.USER_ADMIN }}
          PASSWORD_ADMIN: ${{ secrets.PASSWORD_ADMIN }}
          CLIENT_URL: ${{ secrets.CLIENT_URL || vars.CLIENT_URL }}
          ARTICLE_URL: ${{ secrets.ARTICLE_URL || vars.ARTICLE_URL }}
          INVOICE_URL: ${{ secrets.INVOICE_URL || vars.INVOICE_URL }}
          PAYMENT_URL: ${{ secrets.PAYMENT_URL || vars.PAYMENT_URL }}
        run: npx playwright test tests/e2e/e2e.web.spec.ts

      - name: Upload Web Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web
          path: playwright-report/
          retention-days: 30
